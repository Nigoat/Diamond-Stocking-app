name: Windows Build & Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install aqtinstall and Qt 6
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 --outputdir "$env:RUNNER_TEMP\Qt"
          echo "Qt6_DIR=$env:RUNNER_TEMP\Qt\6.6.3\msvc2019_64" >> $env:GITHUB_ENV
          echo "$env:RUNNER_TEMP\Qt\6.6.3\msvc2019_64\bin" >> $env:GITHUB_PATH

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build Application and Tests
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run Tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Deploy Qt Dependencies
        shell: pwsh
        run: |
          & "$env:Qt6_DIR\bin\windeployqt.exe" --qmldir qml --release --compiler-runtime --no-translations build/bin/DiamondInventory.exe

      - name: Verify deployed files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "DiamondInventory.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Qml.dll",
            "Qt6Quick.dll",
            "platforms\\qwindows.dll",
            "sqldrivers\\qsqlite.dll"
          )

          $missingFiles = $requiredFiles | Where-Object {
            -not (Test-Path (Join-Path "build/bin" $_))
          }

          if ($missingFiles) {
            throw "Windows package is missing required runtime files: $($missingFiles -join ', ')"
          }

          Get-ChildItem build/bin -Recurse | Select-Object FullName

      - name: Setup NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Package with NSIS
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION="1.0.0" installer/installer.nsi

      - name: Upload Standalone Portable App
        uses: actions/upload-artifact@v4
        with:
          name: DiamondInventory-Windows-Portable
          path: build/bin/

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: DiamondInventorySetup-Windows
          path: installer/DiamondInventorySetup.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "Diamond Inventory v1.0.0"
          draft: false
          prerelease: false
          files: installer/DiamondInventorySetup.exe
